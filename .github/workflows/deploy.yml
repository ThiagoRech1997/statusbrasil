name: Deploy

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read
  packages: write

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  build-push:
    name: Build & push multi-arch image
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Extract version from tag
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU (for arm64 cross-compilation)
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push multi-arch image
        run: |
          VERSION="${{ steps.version.outputs.version }}" \
          docker buildx bake multiarch --push
        env:
          NEXT_TELEMETRY_DISABLED: "1"

  deploy:
    name: Deploy to VPS
    runs-on: ubuntu-latest
    needs: build-push
    environment: production
    steps:
      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_DEPLOY_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "${{ vars.VPS_HOST }}" >> ~/.ssh/known_hosts

      - name: Pull image and restart app on VPS
        run: |
          VERSION="${{ needs.build-push.outputs.version }}"
          ssh -i ~/.ssh/deploy_key \
              -o BatchMode=yes \
              "${{ vars.VPS_USER }}@${{ vars.VPS_HOST }}" \
              "cd /opt/statusbrasil && \
               docker compose pull app && \
               docker compose up -d --no-deps app && \
               echo 'Restarted statusbrasil:${VERSION}'"

      - name: Wait for healthcheck
        run: |
          set -e
          PROD_URL="${{ vars.PROD_URL }}"
          for i in $(seq 1 60); do
            status=$(curl -sf -o /dev/null -w "%{http_code}" "${PROD_URL}/api/health" 2>/dev/null || echo "000")
            if [ "$status" = "200" ]; then
              echo "Healthy after ${i}s (HTTP ${status})"
              exit 0
            fi
            echo "  ${i}s — HTTP ${status}, retrying..."
            sleep 1
          done
          echo "::error::Health check failed after 60s — check VPS logs with: ssh deploy@VPS_HOST 'docker compose -f /opt/statusbrasil/compose.yaml logs --tail=50 app'"
          exit 1
